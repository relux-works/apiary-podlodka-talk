name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deck:
    name: Build, audit, PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # playwright-chromium is a devDependency: its install fetches headless Chromium.
      - run: npm ci

      - name: Lint frontmatter
        run: npm run lint

      # Offline build + every slide rendered in Chromium and measured:
      # content inside the layout box, text inside its frame, code not clipped,
      # console clean. Screenshots and a contact sheet land in .temp/audit.
      # verify.sh clears .temp/audit on every run, so each audit is moved to its
      # own folder (even on failure) to keep the deck's screenshots in the artifact.
      - name: Verify deck
        run: |
          rc=0; npm run verify || rc=$?
          mv .temp/audit .temp/audit-deck || true
          exit $rc

      - name: Verify diagram gallery and theme showcases
        run: |
          check() {
            local rc=0
            VERIFY_PORT=$1 .scripts/verify.sh "$2" || rc=$?
            mv .temp/audit ".temp/audit-$3" || true
            return $rc
          }
          check 8093 slides/diagrams.md diagrams
          check 8094 themes/rwb-tech/example.md rwb-tech
          check 8095 themes/rwb-minimal/example.md rwb-minimal

      - name: Export PDF
        run: npm run export

      - uses: actions/upload-artifact@v7
        with:
          name: slides-pdf
          path: .temp/export/*.pdf
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slides-audit
          path: |
            .temp/audit-*/
            .temp/audit/
          retention-days: 30
          if-no-files-found: ignore
