name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deck:
    name: Build, audit, PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # playwright-chromium is a devDependency: its install fetches headless Chromium.
      - run: npm ci

      - name: Lint frontmatter
        run: npm run lint

      # The shared clicker (docs/shared-clicker.md): the deck's dev server in
      # present mode with several windows in headless Chromium. Windows follow
      # each other, and one that opens or reloads joins the live slide.
      - name: Shared clicker sync
        run: npm run check:sync

      # Offline build + every slide rendered in Chromium and measured:
      # content inside the layout box, text inside its frame, code not clipped,
      # console clean. Screenshots and a contact sheet land in .temp/audit.
      # verify.sh clears .temp/audit on every run, so each audit is moved to its
      # own folder (even on failure) to keep the deck's screenshots in the artifact.
      - name: Verify deck
        run: |
          rc=0; npm run verify || rc=$?
          mv .temp/audit .temp/audit-deck || true
          exit $rc

      # The demos in the deck's static build, as the release HTML plays them: no dev
      # server, the tabs of one browser follow each other (docs/run-the-deck.md).
      # Runs before the next verify replaces .temp/dist-offline.
      - name: Demos in the static build
        run: |
          python3 .scripts/serve-static.py 8096 .temp/dist-offline > /dev/null 2>&1 &
          server=$!
          for _ in $(seq 1 25); do curl -s -o /dev/null http://127.0.0.1:8096/ && break; sleep 0.2; done
          rc=0; node .scripts/static-demos.mjs http://127.0.0.1:8096/ slides/slides.md || rc=$?
          kill $server; exit $rc

      - name: Verify diagram gallery and theme showcases
        run: |
          check() {
            local rc=0
            VERIFY_PORT=$1 .scripts/verify.sh "$2" || rc=$?
            mv .temp/audit ".temp/audit-$3" || true
            return $rc
          }
          check 8093 slides/diagrams.md diagrams
          check 8094 themes/rwb-tech/example.md rwb-tech
          check 8095 themes/rwb-minimal/example.md rwb-minimal
          check 8098 slides/demos.md demos

      - name: Export PDF
        run: npm run export

      # In-slide demos (docs/demos.md): frames at fixed moments and a video of the
      # autoplay from one press of →, for review without a dev server.
      - name: Demo frames and video
        if: always()
        run: |
          for s in 2 3; do
            node .scripts/demo-frames.mjs --deck slides/demos.md --slide $s --port 8097 --video --out .temp/demo-frames/slide-$s
            node .scripts/contact-sheet.mjs .temp/demo-frames/slide-$s 2
          done

      # Every slide of the deck at every click, a strip per slide, for reviewing
      # the reveals (Ivan, 13.10). Artifact click-frames: sheet-NN.png, clicks.json.
      - name: Click frames
        if: always()
        run: node .scripts/click-frames.mjs --deck slides/slides.md --port 8099 --out .temp/click-frames

      - uses: actions/upload-artifact@v7
        with:
          name: slides-pdf
          path: .temp/export/*.pdf
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-frames
          path: .temp/demo-frames/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: click-frames
          path: |
            .temp/click-frames/sheet-*.png
            .temp/click-frames/clicks.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slides-audit
          path: |
            .temp/audit-deck/
            .temp/audit-diagrams/
            .temp/audit-rwb-tech/
            .temp/audit-rwb-minimal/
            .temp/audit-demos/
            .temp/audit/
          # .temp is a dot folder, which upload-artifact drops by default.
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore
